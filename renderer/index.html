<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>可插件化工作台</title>
<style>
  /* ═══════════════════════════════════════════════════════════════
     视觉规范：雪艺软件办公文档视觉设计规范 V1.2
     · 清晰至上：留白、层级分明
     · 专业严谨：黑白灰搭框架，品牌色只做点睛
     · 色彩：品牌主色 #0052CC / 正文 #172B4D / 辅助 #6B778C
             积极 #00875A / 警示 #DE350B / 边框 #E1E4E8 / 浅灰 #F4F5F7
     ═══════════════════════════════════════════════════════════════ */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --primary:#0052CC;   /* 品牌主色（科技蓝）：标题前缀、关键文字、链接 */
    --text:#172B4D;      /* 正文主色（深空灰）：替代纯黑 */
    --muted:#6B778C;     /* 辅助说明（中性灰）：边框、分割线、标注 */
    --dim:#6B778C;       /* 兼容旧变量名 */
    --line:#E1E4E8;      /* 分隔线 / 图片边框 */
    --panel:#FFFFFF;
    --soft:#F4F5F7;      /* 表头 / 悬停底色 */
    --ok:#00875A;        /* 积极 / 确认 */
    --err:#DE350B;       /* 警示 / 否定 */
    --mono:"SF Mono",Consolas,"Cascadia Mono",monospace;
    --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  html,body{height:100%}
  body{background:var(--panel);color:var(--text);font-size:13.5px;line-height:1.6;
    overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh}

  /* ── 顶栏 ── */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--text)}
  .brand::before{content:"";width:3px;height:17px;border-radius:2px;background:var(--primary)}  /* 标题前缀：品牌色 */
  .ver{font-size:12px;font-weight:400;color:var(--muted);border:1px solid var(--line);
    padding:2px 8px;border-radius:3px}
  .topbar-actions{display:flex;align-items:center;gap:10px}
  .badge-real{font-size:12px;color:var(--ok);background:#E3FCEF;border:1px solid #ABF5D1;
    padding:4px 10px;border-radius:3px;white-space:nowrap}

  /* ── 按钮 ── */
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:7px 14px;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;
    transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:#0747A6;border-color:#0747A6;color:#fff}
  .btn.ghost{background:transparent}
  .btn.small{padding:4px 11px;font-size:12px}
  .btn.danger{border-color:#FFBDAD;color:var(--err)}
  .btn.danger:hover{border-color:var(--err);background:#FFEBE6;color:var(--err)}

  .body{display:flex;flex:1;min-height:0}

  /* ── 可拖动的分界线（像 VS Code 那样：拖它改面板大小）
       设计：不占空间、不加泛光；平时就是一条 1px 浅灰细线，悬停/拖动时变科技蓝 ── */
  .gutter{flex:none;position:relative;background:transparent;z-index:2}
  .gutter::before{content:"";position:absolute}          /* 透明的"命中区"，让细线也好抓 */
  .gutter::after{content:"";position:absolute;background:transparent;transition:background .12s}

  .g-v{width:0;cursor:col-resize}                         /* 侧栏与内容区之间（不占宽度）*/
  .g-v::before{top:0;bottom:0;left:-4px;width:8px}
  .g-v::after{top:0;bottom:0;left:-1px;width:1px}         /* 侧栏本来有右边框，这条只在悬停时替换它 */

  .g-h{height:8px;margin:-18px 0;cursor:row-resize}       /* 内容区与输出区之间：留 8px 间隙（负外边距抵消 .main 的 18px gap）*/
  .g-h::before{left:0;right:0;top:-3px;height:14px}
  .g-h::after{left:0;right:0;top:3px;height:1px;background:var(--line)}   /* 平时：1px 浅灰，正好落在两块面板正中间 */

  .gutter:hover::after,.gutter.active::after{background:var(--primary)}   /* 悬停/拖动：变蓝，不加泛光 */
  body.resizing{user-select:none;cursor:inherit}

  /* ── 左侧：工作区列表（宿主专有） ── */
  .sidebar{width:var(--sidebar-w,232px);flex:none;background:#FAFBFC;border-right:1px solid var(--line);
    padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
  .side-title{font-size:12px;color:var(--muted);letter-spacing:.06em;padding:2px 8px 10px}
  .ws-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:4px;
    cursor:pointer;color:var(--text);font-size:13.5px;transition:.12s;
    border-left:3px solid transparent}
  .ws-item:hover{background:var(--soft)}
  .ws-item.active{background:var(--panel);color:var(--primary);font-weight:500;
    border-left-color:var(--primary);box-shadow:0 1px 2px rgba(9,30,66,.08)}
  .ws-item .ic{font-size:15px;width:18px;text-align:center;flex:none}
  .ws-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .ws-item .tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);
    border-radius:3px;padding:1px 6px;background:var(--panel)}
  .ws-item .x{opacity:0;color:var(--muted);font-size:13px;padding:0 3px;border-radius:3px}
  .ws-item:hover .x{opacity:1}
  .ws-item .x:hover{color:var(--err);background:#FFEBE6}
  .side-foot{margin-top:auto;padding:10px 8px 4px;font-size:11.5px;color:var(--muted);
    line-height:1.7;border-top:1px solid var(--line)}
  .side-foot .side-head{font-size:11px;color:var(--dim);letter-spacing:.05em;margin-bottom:5px}
  .side-foot .side-path{font-family:var(--mono);font-size:10.5px;color:var(--primary);
    word-break:break-all;line-height:1.5;cursor:pointer;padding:4px 6px;border-radius:4px;
    background:rgba(0,82,204,.06);border:1px dashed #B3D4FF}
  .side-foot .side-path:hover{background:#DEEBFF;border-style:solid}
  .side-foot .side-hint{margin-top:7px;font-size:10.5px;color:var(--dim);line-height:1.6}

  /* ── 主区：内容区（插件声明的区域，和输出面板用同一套"面板"语言） ── */
  .main{flex:1;display:flex;flex-direction:column;gap:18px;padding:20px 24px;min-width:0;min-height:0}
  .panel{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;overflow:hidden;min-height:220px;flex:1 1 auto}
    /* ↑ min-height：保证内容区至少能完整放下一行卡片，不会因为"差几像素"而冒出滚动条 */
  .panel-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft);
    min-height:64px}                                      /* 固定最小高度：所有工作区的标题栏一样高 */
  .panel-head h1{font-size:15px;font-weight:700;line-height:1.4;color:var(--text);
    display:flex;align-items:center;gap:9px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 名称过长省略，不换行 */
  .panel-head h1::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary);flex:none}
  .panel-head .desc{font-size:12px;color:var(--muted);padding-left:12px;display:block;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}   /* 说明固定一行 */
  .panel-body{flex:1;min-height:0;overflow:auto;padding:14px;
    scrollbar-width:none;-ms-overflow-style:none}          /* 内容超出时用滚轮滚，但不显示拉动条 */
  .panel-body::-webkit-scrollbar{width:0;height:0}
  .hidden{display:none !important}

  /* ── 自定义界面宿主（L3）：工作区自带的界面在沙箱 iframe 里跑 ── */
  .plugin-host{height:100%;min-height:0}
  .plugin-host iframe{width:100%;height:100%;border:0;border-radius:4px;display:block;background:#0B0E14}
  .ws-meta{font-size:11.5px;color:var(--muted);text-align:right;white-space:pre-line;
    font-family:var(--mono);line-height:1.7;flex:none}     /* 固定两行（见 renderMain），保证标题栏等高 */

  /* ── 动作卡片 ── */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;align-content:start}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:15px 15px 13px;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(9,30,66,.10)}
  .card.running{border-left:3px solid var(--primary)}
  .card.success{border-left:3px solid var(--ok)}
  .card.failed{border-left:3px solid var(--err)}
  .card .ct{display:flex;align-items:center;gap:9px;font-weight:500;font-size:14px;
    color:var(--text);padding-right:78px}
  .card .ct .ic{font-size:16px}
  .card .cmd{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:10px;
    line-height:1.55;word-break:break-all;max-height:3.1em;overflow:hidden}
  .card .foot{margin-top:10px;font-size:11.5px;color:var(--muted);font-family:var(--mono);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 这条命令会在哪个目录里跑（默认=工作区包目录，作者可声明 cwd 改掉） */
  .card .where{margin-top:6px;font-size:10.5px;color:var(--dim);font-family:var(--mono);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{position:absolute;top:13px;right:13px;font-size:11px;padding:2px 8px;border-radius:3px;
    border:1px solid var(--line);color:var(--muted);background:var(--soft);white-space:nowrap}
  .pill.running{color:var(--primary);border-color:#B3D4FF;background:#DEEBFF}
  .pill.success{color:var(--ok);border-color:#ABF5D1;background:#E3FCEF}
  .pill.failed{color:var(--err);border-color:#FFBDAD;background:#FFEBE6}
  .empty{color:var(--muted);font-size:13px;line-height:2;padding:34px 22px;text-align:center;
    grid-column:1/-1;border:1px dashed var(--line);border-radius:6px;background:#FAFBFC}

  /* ── 输出面板（宿主提供的能力） ── */
  .console{flex:0 0 var(--console-h,300px);min-height:120px;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .console-head{display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft);
    font-size:12.5px;color:var(--muted);flex:none}
  .console-head .t{display:flex;align-items:center;gap:8px}
  .console-head .t::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--primary)}
  .console-body{flex:1;overflow:auto;padding:12px 15px;font-family:var(--mono);
    font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-all;background:#FCFDFE}
  .l-time{color:var(--muted)}
  .l-cmd{color:var(--primary)}
  .l-ok{color:var(--ok)}
  .l-err{color:var(--err)}
  .l-dim{color:var(--muted)}
  .l-info{color:var(--text)}

  /* 弹窗样式已随「导入工作区」弹窗一起移除：安装改为用户自行复制到工作区文件夹，
     将来做「拖拽安装 / .wsp 导入」时若需要确认弹窗，再在这里补回来。 */

  /* ── 无边框窗口：顶栏整条是"拖动区"，窗口按钮自绘（像 VS Code） ── */
  .topbar{-webkit-app-region:drag;padding:10px 0 10px 22px}
  .topbar .btn,.topbar .badge-real,.winctl{-webkit-app-region:no-drag}
  .winctl{display:flex;align-items:center;gap:2px;margin-left:10px;padding-left:10px;
    border-left:1px solid var(--line)}
  .wc{-webkit-app-region:no-drag;width:44px;height:34px;background:transparent;border:none;
    color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--sans);
    border-radius:4px;transition:.12s;line-height:1}
  .wc:hover{background:var(--soft);color:var(--text)}
  .wc.close:hover{background:var(--err);color:#fff}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">🛠 可插件化工作台 <span class="ver">v0.1 · Electron</span></div>
    <div class="topbar-actions">
      <span class="badge-real">真实执行模式：会在本机运行命令</span>
      <button class="btn" id="btnRefresh" title="重新扫描工作区文件夹（复制进新工作区后点它）">⟳ 刷新</button>
      <div class="winctl">
        <button class="wc" id="wcMin" title="最小化">─</button>
        <button class="wc" id="wcMax" title="最大化">□</button>
        <button class="wc close" id="wcClose" title="关闭">✕</button>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="side-title">工作区</div>
      <ul id="wsList" style="list-style:none;display:flex;flex-direction:column;gap:5px"></ul>
      <div class="side-foot">
        <div class="side-head">工作区文件夹</div>
        <div class="side-path" id="wsDirPath" title="">（读取中…）</div>
        <div class="side-hint">
          复制工作区包进来，再点<br>顶栏「⟳ 刷新」<br>
          <span style="color:var(--muted)">点路径打开文件夹</span>
        </div>
      </div>
    </aside>

    <div class="gutter g-v" id="gutterV" title="拖动可调整侧栏宽度"></div>

    <main class="main">
      <!-- 内容区面板 = 插件（工作区）声明的区域，宿主提供外壳与渲染 -->
      <section class="panel works">
        <div class="panel-head">
          <div>
            <h1 id="wsName">—</h1>
            <span class="desc" id="wsDesc"></span>
          </div>
          <div class="ws-meta" id="wsMeta"></div>
        </div>
        <div class="panel-body" id="panelBody">
          <!-- 默认渲染器：宿主按清单画标准卡片 -->
          <div class="cards" id="cards"></div>
          <!-- 自定义界面宿主：工作区自带界面时，在这里装一个沙箱 iframe（L3） -->
          <div class="plugin-host hidden" id="pluginHost"></div>
        </div>
      </section>

      <div class="gutter g-h" id="gutterH" title="拖动可调整两块面板的高度"></div>

      <section class="console">
        <div class="console-head">
          <div>输出 <span id="runHint" style="color:var(--dim)"></span></div>
          <div style="display:flex;gap:8px">
            <button class="btn ghost small danger" id="btnStopAll">全部停止</button>
            <button class="btn ghost small" id="btnClear">清空</button>
          </div>
        </div>
        <div class="console-body" id="log"></div>
      </section>
    </main>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let workspaces = [];
let currentId = null;
const runOf = {};         // actionId -> runId（正在跑的）
const lastOf = {};        // actionId -> {state, dur}

/* ── 工具 ── */
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function lineStart(cls){
  const el = $('log');
  const div = document.createElement('div');
  div.className = cls || '';
  div.innerHTML = '<span class="l-time">[' + stamp() + '] </span>';
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div;
}
function log(text, cls){
  const div = lineStart(cls);
  div.appendChild(document.createTextNode(text));
  $('log').scrollTop = $('log').scrollHeight;
}
function appendChunk(stream, text){
  const el = $('log');
  const cls = stream === 'stderr' ? 'l-err' : 'l-info';
  const div = document.createElement('div');
  const parts = String(text).split('\n');
  parts.forEach((seg, i) => {
    if (i > 0) div.appendChild(document.createElement('br'));
    if (seg !== '') {
      const s = document.createElement('span');
      s.className = cls;
      s.textContent = seg;
      div.appendChild(s);
    }
  });
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

/* ── 渲染 ── */
function current(){ return workspaces.find(w => w.id === currentId) || workspaces[0]; }

function renderSidebar(){
  const ul = $('wsList');
  ul.innerHTML = '';
  if (!workspaces.length) {
    const li = document.createElement('li');
    li.style.cssText = 'color:var(--dim);font-size:12.5px;padding:8px 10px;line-height:1.7';
    li.textContent = '（还没有工作区）';
    ul.appendChild(li);
    return;
  }
  workspaces.forEach(w => {
    const li = document.createElement('li');
    li.className = 'ws-item' + (w.id === currentId ? ' active' : '');
    const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = w.icon || '📦';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = w.name || '(未命名)';
    li.append(ic, nm);
    if (w.builtin) {
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = '内置';
      li.appendChild(tag);
    } else {
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕'; x.title = '卸载';
      x.onclick = async ev => {
        ev.stopPropagation();
        const r = await window.wb.uninstall(w.dir);
        log('已卸载工作区：' + w.name + ((r && r.deleted) ? '（并已删除复制进软件目录的文件）' : ''), 'l-dim');
        await refresh();
      };
      li.appendChild(x);
    }
    li.title = w.description || w.name;
    li.onclick = () => { currentId = w.id; renderSidebar(); renderMain(); };
    ul.appendChild(li);
  });
}

function renderMain(){
  const w = current();

  // 一个工作区都没有时的空状态
  if (!w) {
    $('wsName').textContent = '还没有工作区';
    $('wsDesc').textContent = '点右上角「＋ 导入工作区」，选择一个包含 manifest.json 的工作区包文件夹';
    $('wsMeta').textContent = '';
    $('pluginHost').classList.add('hidden');
    $('pluginHost').innerHTML = '';
    $('cards').classList.remove('hidden');
    $('cards').innerHTML =
      '<div class="empty">' +
      '这里会显示工作区里的按钮<br><br>' +
      '① 准备一个文件夹，里面放一个 manifest.json<br>' +
      '② 点右上角「＋ 导入工作区」选中这个文件夹<br>' +
      '③ 确认它要跑的命令后，它的按钮就出现在这里' +
      '</div>';
    return;
  }

  $('wsName').textContent = w.name || '(未命名工作区)';
  $('wsDesc').textContent = w.description || '';
  $('wsDesc').title = w.description || '';
  const acts = Array.isArray(w.actions) ? w.actions : [];
  // 固定两行：第一行 = 标识与规模，第二行 = 权限与界面类型（保证所有工作区标题栏等高）
  $('wsMeta').textContent =
    'id: ' + (w.id || '-') + ' · ' + acts.length + ' 个动作\n' +
    '权限: ' + (((w.permissions || []).join(' / ')) || '—') +
    ' · 界面: ' + ((w.ui && w.ui.entry) ? '自定义' : '默认');

  // 该工作区自带界面（L3）→ 内容区交给它的沙箱 iframe
  if (w.ui && w.ui.entry) { renderCustomUI(w); return; }

  // 否则用宿主默认渲染器
  $('pluginHost').classList.add('hidden');
  $('cards').classList.remove('hidden');

  const box = $('cards');
  box.innerHTML = '';
  if (!acts.length) {
    box.innerHTML = '<div class="empty">这个工作区还没有动作</div>';
    return;
  }
  acts.forEach((a, i) => {
    const aid = actionId(w, a, i);
    const running = runOf[aid];
    const last = lastOf[aid];

    const card = document.createElement('div');
    card.className = 'card' + (running ? ' running' : (last ? ' ' + last.state : ''));
    card.dataset.aid = aid;

    const pill = document.createElement('span');
    pill.className = 'pill' + (running ? ' running' : (last ? ' ' + last.state : ''));
    pill.textContent = running ? '运行中' : (last ? (last.state === 'success' ? '✓ 成功' : '✗ 失败') : '就绪');

    const ct = document.createElement('div');
    ct.className = 'ct';
    const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = a.icon || '▶';
    const tt = document.createElement('span'); tt.textContent = a.title || '(未命名动作)';
    ct.append(ic, tt);

    const cmd = document.createElement('div');
    cmd.className = 'cmd';
    cmd.textContent = a.command || '(未声明命令)';
    cmd.title = a.command || '';

    const foot = document.createElement('div');
    foot.className = 'foot';
    foot.textContent = running ? '正在运行…'
      : (last ? ('上次 ' + (last.state === 'success' ? '✓ 成功' : '✗ 失败') + ' · 用时 ' + last.dur + 's') : '点击运行');

    // 在哪个目录里跑：没写 cwd 就是工作区包自己的目录
    const where = document.createElement('div');
    where.className = 'where';
    where.textContent = a.cwd
      ? ('📁 在作者指定的目录执行：' + a.cwd)
      : '📁 在工作区包目录内执行';
    where.title = a.cwd ? String(a.cwd) : '工作区包所在目录：' + (w.dir || '');

    card.append(pill, ct, cmd, foot, where);

    if (running) {
      const stop = document.createElement('button');
      stop.className = 'btn small danger';
      stop.style.marginTop = '9px';
      stop.textContent = '■ 停止';
      stop.onclick = ev => { ev.stopPropagation(); window.wb.stop(runOf[aid]); };
      card.appendChild(stop);
    }

    card.onclick = () => {
      if (runOf[aid]) return;             // 正在跑就不重复启动
      startAction(w, a, aid);
    };
    box.appendChild(card);
  });
}

function actionId(w, a, i){
  // a.id 是**作者在清单里写的**动作 id，绝不能在这里被覆盖成算出来的那个：
  // 一旦覆盖，第二次计算就会变成「工作区id:工作区id:动作id」，
  // 于是自定义界面请求执行时会被判成"不存在的动作"（点按钮没反应）。
  if (!a.uid) a.uid = w.id + ':' + (a.id || (i + '-' + (a.title || 'action')));
  return a.uid;
}

/* ══════════════════════════════════════════════════════════════
   自定义界面（L3）：工作区自带界面，装进沙箱 iframe
   · 界面拿不到宿主权限，也不能直接执行命令
   · 它只能通过 postMessage 请求宿主："请帮我跑某个动作"
   · 执行权、命令原文、输出回显，全部仍由宿主掌握
   ══════════════════════════════════════════════════════════════ */
let pluginTimer = null;

function pluginFrame(){ return document.querySelector('#pluginHost iframe'); }

function pluginActionList(w){
  return (w.actions || []).map((a, i) => {
    const aid = actionId(w, a, i);
    return { id: aid, title: a.title, icon: a.icon, command: a.command,
             running: !!runOf[aid], last: lastOf[aid] || null };
  });
}

function postToPlugin(msg){
  const f = pluginFrame();
  if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*');
}

function postInitToPlugin(w){
  if (!w || !w.ui) return;
  postToPlugin({
    type: 'host-init',
    workspace: { id: w.id, name: w.name, description: w.description, icon: w.icon },
    actions: pluginActionList(w),
    permissions: w.permissions || [],
    theme: 'light'
  });
}

function renderCustomUI(w){
  $('cards').classList.add('hidden');
  const host = $('pluginHost');
  host.classList.remove('hidden');

  const url = 'wsp://local/' + encodeURIComponent(w.id) + '/' + (w.ui.entry || 'index.html');
  const same = host.dataset.ws === w.id && pluginFrame();

  if (same) { postInitToPlugin(w); return; }   // 同一个工作区：复用，不重载

  host.dataset.ws = w.id;
  host.innerHTML = '';
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts');   // 关键：不给 allow-same-origin（拿不到宿主数据）
  f.setAttribute('title', '工作区自定义界面：' + (w.name || ''));
  f.src = url;
  host.appendChild(f);

  // 3 秒内没收到插件的 ready → 在输出区给出提示（便于排查界面加载失败）
  if (pluginTimer) clearTimeout(pluginTimer);
  pluginTimer = setTimeout(() => {
    if (host.dataset.ready !== w.id) {
      log('提示：该工作区的自定义界面未就绪（可能文件缺失或脚本报错）：' + (w.ui.entry || 'index.html'), 'l-err');
    }
  }, 3000);
}

// 接收插件界面发来的消息（严格校验来源，只认我们自己的 iframe）
window.addEventListener('message', ev => {
  const f = pluginFrame();
  if (!f || ev.source !== f.contentWindow) return;    // 来源校验
  const msg = ev.data || {};
  const w = current();
  if (!w || !w.ui) return;

  if (msg.type === 'ready') {
    $('pluginHost').dataset.ready = w.id;
    if (pluginTimer) clearTimeout(pluginTimer);
    postInitToPlugin(w);
    log('已加载工作区自定义界面：' + (w.name || '') , 'l-dim');
  } else if (msg.type === 'run') {
    const a = (w.actions || []).find((x, i) => actionId(w, x, i) === msg.actionId);
    if (!a) { log('插件界面请求了一个不存在的动作：' + msg.actionId, 'l-err'); return; }
    if (runOf[msg.actionId]) return;                  // 正在跑就不重复启动
    log('（插件界面请求执行）' + a.title, 'l-dim');
    startAction(w, a, msg.actionId);
  } else if (msg.type === 'notify') {
    log('[界面] ' + String(msg.text || ''), 'l-dim');
  }
});

/* ── 执行 ── */
async function startAction(w, a, aid){
  if (!aid) aid = actionId(w, a, (w.actions || []).indexOf(a));
  if (runOf[aid]) return;
  log('▶ ' + a.title, 'l-dim');
  log('$ ' + a.command, 'l-cmd');
  const r = await window.wb.run({
    workspaceId: w.id, actionId: aid, command: a.command, cwd: a.cwd
  });
  if (!r || !r.ok) {
    log('启动失败：' + ((r && r.error) || '未知错误'), 'l-err');
    lastOf[aid] = { state: 'failed', dur: '0.0' };
    renderMain();
    return;
  }
  runOf[aid] = r.runId;
  renderMain();
}

/* ── 后台事件 ── */
window.wb.onEvent(msg => {
  if (msg.type === 'output') {
    appendChunk(msg.stream, msg.text);
    postToPlugin({ type: 'output', actionId: msg.actionId, runId: msg.runId,
                   stream: msg.stream, text: msg.text });
  } else if (msg.type === 'started') {
    if (msg.cwd) log('↳ 工作目录：' + msg.cwd, 'l-dim');
    postToPlugin({ type: 'action-started', actionId: msg.actionId, runId: msg.runId,
                   command: msg.command, pid: msg.pid });
  } else if (msg.type === 'maximized') {
    $('wcMax').textContent = msg.value ? '❐' : '□';
  } else if (msg.type === 'exit') {
    const aid = msg.actionId;
    if (msg.stopped) {
      log('■ 已停止（用时 ' + msg.duration + 's）', 'l-dim');
      lastOf[aid] = { state: 'failed', dur: msg.duration };
    } else if (msg.code === 0) {
      log('✓ 完成（用时 ' + msg.duration + 's）', 'l-ok');
      lastOf[aid] = { state: 'success', dur: msg.duration };
    } else {
      log('✗ 结束，退出码 ' + msg.code + '（用时 ' + msg.duration + 's）', 'l-err');
      lastOf[aid] = { state: 'failed', dur: msg.duration };
    }
    delete runOf[aid];
    postToPlugin({ type: 'action-exit', actionId: aid, runId: msg.runId, code: msg.code,
                   stopped: !!msg.stopped, duration: msg.duration });
    renderMain();
  }
});

/* ── 工作区文件夹（安装位置，与 Minecraft 的 mods 目录同理） ── */
async function loadWsDir(){
  const r = await window.wb.workspaceDir();
  const p = (r && r.dir) || '';
  const el = $('wsDirPath');
  el.textContent = p || '（读取失败）';
  el.title = p;
  return p;
}
$('wsDirPath').onclick = async () => {
  const p = await loadWsDir();
  if (!p) return;
  const r = await window.wb.openPath(p);
  if (r && r.ok === false) log('打开文件夹失败：' + r.error, 'l-err');
};

/* ── 启动 ── */
async function refresh(preferId){
  workspaces = await window.wb.listWorkspaces();
  if (preferId) currentId = preferId;
  if (!workspaces.some(w => w.id === currentId)) currentId = workspaces.length ? workspaces[0].id : null;
  renderSidebar();
  renderMain();
}

$('btnRefresh').onclick = async () => {
  const before = workspaces.length;
  try {
    await refresh();
  } catch (err) {
    log('刷新失败：' + ((err && err.message) || err), 'l-err');
    return;
  }
  const after = workspaces.length;
  log('已刷新：重新扫描工作区文件夹，共 ' + after + ' 个工作区' +
      (after > before ? '（新增 ' + (after - before) + ' 个）' : ''), 'l-ok');
};
$('btnClear').onclick = () => { $('log').innerHTML = ''; };
$('btnStopAll').onclick = () => {
  const ids = Object.keys(runOf);
  if (!ids.length) { log('当前没有正在运行的动作', 'l-dim'); return; }
  ids.forEach(a => window.wb.stop(runOf[a]));
};

/* ── 无边框窗口的自绘按钮 ── */
async function syncMaxIcon(){
  const r = await window.wb.winIsMaximized();
  $('wcMax').textContent = (r && r.maximized) ? '❐' : '□';
}
$('wcMin').onclick = () => window.wb.winMinimize();
$('wcMax').onclick = async () => {
  const r = await window.wb.winToggleMaximize();
  $('wcMax').textContent = (r && r.maximized) ? '❐' : '□';
};
$('wcClose').onclick = () => window.wb.winClose();

// 双击顶栏空白处 = 最大化/还原（和系统窗口一致的手感）
document.querySelector('.topbar').addEventListener('dblclick', async e => {
  if (e.target.closest('button')) return;
  const r = await window.wb.winToggleMaximize();
  $('wcMax').textContent = (r && r.maximized) ? '❐' : '□';
});
syncMaxIcon();

/* ── 可拖动分界线：拖侧栏右边缘调宽度 / 拖输出区上边缘调高度 ── */
const root = document.documentElement;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let drag = null;   // 'v' = 竖线（侧栏宽度）｜'h' = 横线（输出区高度）

function saveLayout(){
  try {
    localStorage.setItem('ui.sidebarW', String(parseInt(root.style.getPropertyValue('--sidebar-w')) || ''));
    localStorage.setItem('ui.consoleH', String(parseInt(root.style.getPropertyValue('--console-h')) || ''));
  } catch (e) { /* 忽略 */ }
}
function restoreLayout(){
  try {
    const w = parseInt(localStorage.getItem('ui.sidebarW'));
    const h = parseInt(localStorage.getItem('ui.consoleH'));
    if (w) root.style.setProperty('--sidebar-w', w + 'px');
    if (h) root.style.setProperty('--console-h', h + 'px');
  } catch (e) { /* 忽略 */ }
}

function startDrag(which, el){
  drag = which;
  el.classList.add('active');
  document.body.classList.add('resizing');
  document.body.style.cursor = (which === 'v') ? 'col-resize' : 'row-resize';
}
function endDrag(){
  drag = null;
  document.querySelectorAll('.gutter').forEach(g => g.classList.remove('active'));
  document.body.classList.remove('resizing');
  document.body.style.cursor = '';
  saveLayout();
}

$('gutterV').addEventListener('mousedown', e => { e.preventDefault(); startDrag('v', $('gutterV')); });
$('gutterH').addEventListener('mousedown', e => { e.preventDefault(); startDrag('h', $('gutterH')); });

window.addEventListener('mousemove', e => {
  if (!drag) return;
  if (drag === 'v') {
    const maxW = Math.min(460, window.innerWidth - 420);
    root.style.setProperty('--sidebar-w', clamp(e.clientX, 170, Math.max(200, maxW)) + 'px');
  } else {
    const r = document.querySelector('.main').getBoundingClientRect();
    const bottom = r.bottom - 20;                 // .main 的下内边距
    const maxH = Math.max(160, r.height - 240);   // 给内容区面板留出 220px + 间隙与余量
    root.style.setProperty('--console-h', clamp(bottom - e.clientY, 120, maxH) + 'px');
  }
});
window.addEventListener('mouseup', () => { if (drag) endDrag(); });

/* ── 界面出错也要看得见 ──
   否则点了按钮没反应时，用户只会以为"软件坏了"，而原因无处可查。 */
window.addEventListener('error', e => {
  log('界面出错：' + (e.message || e.error || '未知错误') +
      (e.lineno ? '（第 ' + e.lineno + ' 行）' : ''), 'l-err');
});
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  log('界面出错（异步）：' + ((r && (r.message || r)) || '未知错误'), 'l-err');
});

restoreLayout();

// 每秒刷新"正在运行"的计时显示
setInterval(() => { if (Object.keys(runOf).length) renderMain(); }, 1000);

log('可插件化工作台 · Electron 版 v0.1', 'l-ok');
log('真实执行模式：点击按钮会在本机运行对应命令，输出实时显示在这里。', 'l-dim');
refresh().catch(err => log('读取工作区失败：' + ((err && err.message) || err), 'l-err'));
loadWsDir();
</script>
</body>
</html>
